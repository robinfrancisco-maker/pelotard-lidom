name: Sincronizador Automatico LIDOM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-lidom:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar datos de LIDOM
        run: |
          curl -s -A "Mozilla/5.0" "https://statsapi.mlb.com/api/v1/standings?leagueId=132" -o standings.json

      - name: Enviar datos a Render
        run: |
          curl -s -X POST https://pelotard-lidom.onrender.com/api/update-lidom -H "Content-Type: application/json" --data-binary @standings.json
