name: Sincronizador Automático LIDOM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-lidom:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar Standings y Schedule de LIDOM
        run: |
          # 1. Despertar el servidor en Render
          curl -s https://pelotard-lidom.onrender.com/ > /dev/null

          # 2. Calcular ventana de fechas (3 días atrás y 3 días adelante)
          START_DATE=$(date -d "3 days ago" +'%Y-%m-%d' 2>/dev/null || date -v-3d +'%Y-%m-%d')
          END_DATE=$(date -d "3 days" +'%Y-%m-%d' 2>/dev/null || date -v+3d +'%Y-%m-%d')

          # 3. Descargar Posiciones de LIDOM (League 131)
          curl -s -A "Mozilla/5.0" "https://statsapi.mlb.com/api/v1/standings?leagueId=131" -o standings.json

          # 4. Descargar Cartelera ampliando la búsqueda con sportId=1 y leagueId=131
          curl -s -A "Mozilla/5.0" "https://statsapi.mlb.com/api/v1/schedule?sportId=1&leagueId=131&startDate=${START_DATE}&endDate=${END_DATE}" -o schedule.json

          # 5. Enviar Posiciones a Render
          curl -s -X POST https://pelotard-lidom.onrender.com/api/update-lidom \
            -H "Content-Type: application/json" \
            -d @standings.json

          # 6. Enviar Cartelera a Render
          curl -s -X POST https://pelotard-lidom.onrender.com/api/update-schedule \
            -H "Content-Type: application/json" \
            -d @schedule.json
