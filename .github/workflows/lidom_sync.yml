name: Sincronizador Automático LIDOM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-lidom:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar Standings y Schedule de LIDOM
        run: |
          # 1. Despertar el servidor en Render
          curl -s https://pelotard-lidom.onrender.com/ > /dev/null

          # 2. Rango de fechas (ayer, hoy y mañana)
          YESTERDAY=$(date -d "yesterday" +'%Y-%m-%d' 2>/dev/null || date -v-1d +'%Y-%m-%d')
          TOMORROW=$(date -d "tomorrow" +'%Y-%m-%d' 2>/dev/null || date -v+1d +'%Y-%m-%d')

          # 3. Descargar Standings de LIDOM (leagueId=131)
          curl -s -A "Mozilla/5.0" "https://statsapi.mlb.com/api/v1/standings?leagueId=131" -o standings.json

          # 4. Descargar Cartelera de LIDOM (leagueId=131)
          curl -s -A "Mozilla/5.0" "https://statsapi.mlb.com/api/v1/schedule?sportId=1&leagueId=131&startDate=${YESTERDAY}&endDate=${TOMORROW}" -o schedule.json

          # 5. Enviar Standings a Render
          curl -s -X POST https://pelotard-lidom.onrender.com/api/update-lidom \
            -H "Content-Type: application/json" \
            -d @standings.json

          # 6. Enviar Schedule a Render
          curl -s -X POST https://pelotard-lidom.onrender.com/api/update-schedule \
            -H "Content-Type: application/json" \
            -d @schedule.json
