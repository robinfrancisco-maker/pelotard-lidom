name: Sincronizador Automático LIDOM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-lidom:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar Standings y Schedule con el Servidor
        run: |
          # 1. Asegurar que Render esté activo antes de enviar datos
          curl -s https://pelotard-lidom.onrender.com/ > /dev/null

          # 2. Descargar Standings desde la API MLB
          curl -s -A "Mozilla/5.0" "https://statsapi.mlb.com/api/v1/standings?leagueId=132" -o standings.json

          # 3. Descargar Cartelera (Schedule) desde la API MLB
          curl -s -A "Mozilla/5.0" "https://statsapi.mlb.com/api/v1/schedule?sportId=132&leagueId=132" -o schedule.json

          # 4. Enviar Standings a Render en formato JSON válido
          curl -s -X POST https://pelotard-lidom.onrender.com/api/update-lidom \
            -H "Content-Type: application/json" \
            -d @standings.json

          # 5. Enviar Schedule al endpoint correspondiente en Render
          curl -s -X POST https://pelotard-lidom.onrender.com/api/update-schedule \
            -H "Content-Type: application/json" \
            -d @schedule.json
