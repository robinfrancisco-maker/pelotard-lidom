<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELOTARD - Plataforma Recreativa LIDOM</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-blue: #0284c7;
            --text-light: #f8fafc;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0; padding: 20px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--accent-orange); padding-bottom: 10px; margin-bottom: 20px;
        }
        .logo h1 { margin: 0; color: var(--accent-orange); letter-spacing: 1px; }
        .logo p { margin: 0; font-size: 0.8rem; color: #94a3b8; }
        .status-badge {
            background-color: #10b981; color: #000; padding: 6px 12px;
            border-radius: 20px; font-weight: bold; font-size: 0.85rem;
        }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            background-color: var(--panel-bg); color: #94a3b8; border: 1px solid var(--border-color);
            padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background-color: var(--accent-orange); color: #fff; border-color: var(--accent-orange); }
        .content-section { display: none; }
        .content-section.active { display: block; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .card {
            background-color: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 15px;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: center; }
        th, td { padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        th { background-color: #0f172a; color: var(--accent-orange); }
        .team-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
        .bet-btn {
            background-color: var(--accent-blue); color: white; border: none;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .bet-btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <h1>PELOTARD</h1>
            <p>LIDOM AUTOMÁTICO EN VIVO</p>
        </div>
        <div class="status-badge" id="syncStatus">🔴 Conectando a Servidor...</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('cartelera')">1. ⚾ Cartelera</button>
        <button class="tab-btn" onclick="switchTab('standings')">2. 📊 Standings</button>
        <button class="tab-btn" onclick="switchTab('boleta')">3. 🎟️ Mi Boleta (<span id="ticketCount">0</span>)</button>
    </div>

    <!-- SECCIÓN 1: CARTELERA -->
    <div id="sec-cartelera" class="content-section active">
        <div class="card-grid" id="gamesContainer">
            <div style="text-align: center; width: 100%; padding: 40px; color: #94a3b8;">
                Esperando actualización de juegos desde el servidor...
            </div>
        </div>
    </div>

    <!-- SECCIÓN 2: STANDINGS OFICIALES -->
    <div id="sec-standings" class="content-section">
        <div class="card">
            <h3>Tabla de Posiciones Oficial LIDOM</h3>
            <table>
                <thead>
                    <tr>
                        <th>Equipo</th>
                        <th>JJ</th>
                        <th>G</th>
                        <th>P</th>
                        <th>PCT</th>
                        <th>DIF</th>
                        <th>RACHA</th>
                    </tr>
                </thead>
                <tbody id="standingsTable">
                    <tr><td colspan="7">Esperando datos de tabla de posiciones...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SECCIÓN 3: BOLETA DE APUESTAS -->
    <div id="sec-boleta" class="content-section">
        <div class="card" id="ticketPrintArea">
            <h3>Boleta de Apuesta (PELOTARD)</h3>
            <div id="selectedBets">No hay selecciones en la boleta.</div>
            <hr style="border-color: var(--border-color); margin: 15px 0;">
            <button class="bet-btn" style="width: 100%; padding: 10px;" onclick="downloadTicket()">Descargar Boleto PNG</button>
        </div>
    </div>

    <script>
        const socket = io();
        let mySelections = [];

        // Confirmar conexión con el socket del servidor
        socket.on('connect', () => {
            document.getElementById('syncStatus').innerText = '🟢 Auto-sincronizado (En vivo)';
            document.getElementById('syncStatus').style.backgroundColor = '#10b981';
        });

        socket.on('disconnect', () => {
            document.getElementById('syncStatus').innerText = '🔴 Reconectando...';
            document.getElementById('syncStatus').style.backgroundColor = '#ef4444';
        });

        // Escuchar la emisión en tiempo real enviada por el servidor
        socket.on('lidom_auto_update', (data) => {
            if (!data) return;
            renderGames(data.games || []);
            renderStandings(data.standings || []);
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            
            if (tabName === 'cartelera') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('sec-cartelera').classList.add('active');
            } else if (tabName === 'standings') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('sec-standings').classList.add('active');
            } else if (tabName === 'boleta') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('sec-boleta').classList.add('active');
            }
        }

        function renderGames(games) {
            const container = document.getElementById('gamesContainer');
            if (!games || games.length === 0) {
                container.innerHTML = '<div style="text-align: center; width: 100%; padding: 40px; color: #94a3b8;">No hay partidos cargados actualmente.</div>';
                return;
            }

            container.innerHTML = games.map(g => `
                <div class="card">
                    <div style="font-size: 0.8rem; color: var(--accent-orange); display: flex; justify-content: space-between;">
                        <span>${g.time || '07:15 PM'}</span>
                        <span>${g.stadium || 'Estadio LIDOM'}</span>
                    </div>
                    <hr style="border-color: var(--border-color); margin: 8px 0;">
                    <div class="team-row">
                        <strong>${g.awayName || g.away}</strong>
                        <button class="bet-btn" onclick="addBet('${g.awayName || g.away}', 'ML', ${g.awayMl || 1.90})">ML ${g.awayMl || 1.90}</button>
                    </div>
                    <div class="team-row">
                        <strong>${g.homeName || g.home}</strong>
                        <button class="bet-btn" onclick="addBet('${g.homeName || g.home}', 'ML', ${g.homeMl || 1.90})">ML ${g.homeMl || 1.90}</button>
                    </div>
                </div>
            `).join('');
        }

        function renderStandings(standings) {
            const tbody = document.getElementById('standingsTable');
            if (!standings || standings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">No hay posiciones cargadas.</td></tr>';
                return;
            }

            tbody.innerHTML = standings.map(s => `
                <tr>
                    <td style="text-align: left; font-weight: bold;">${s.name} (${s.code})</td>
                    <td>${s.jj}</td>
                    <td>${s.g}</td>
                    <td>${s.p}</td>
                    <td>${s.pct}</td>
                    <td>${s.dif}</td>
                    <td>${s.racha}</td>
                </tr>
            `).join('');
        }

        function addBet(team, type, odds) {
            mySelections.push({ team, type, odds });
            document.getElementById('ticketCount').innerText = mySelections.length;
            renderTicket();
            alert(`Añadido a la boleta: ${team} (${type})`);
        }

        function renderTicket() {
            const container = document.getElementById('selectedBets');
            if (mySelections.length === 0) {
                container.innerHTML = 'No hay selecciones en la boleta.';
                return;
            }
            container.innerHTML = mySelections.map((b, i) => `
                <div style="margin: 8px 0; font-size: 0.9rem;">
                    #${i+1} <strong>${b.team}</strong> - Logro: ${b.odds}
                </div>
            `).join('');
        }

        function downloadTicket() {
            if (mySelections.length === 0) {
                alert('Seleccione al menos una apuesta antes de descargar la boleta.');
                return;
            }
            html2canvas(document.getElementById('ticketPrintArea')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'boleto-pelotard.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
