<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELOTARD - Plataforma Recreativa LIDOM</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-blue: #0284c7;
            --text-light: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-orange);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .logo h1 {
            margin: 0;
            color: var(--accent-orange);
            letter-spacing: 1px;
        }

        .logo p {
            margin: 0;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .status-badge {
            background-color: #16a34a;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
            color: white;
        }

        .tab-content {
            display: none;
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .tab-content.active {
            display: block;
        }

        /* Cartelera Grid Styles */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .game-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .game-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .team-code {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .team-name {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }

        .team-score {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent-orange);
            margin-top: 5px;
        }

        .vs {
            font-weight: bold;
            color: #64748b;
        }

        .empty-msg {
            text-align: center;
            color: #94a3b8;
            padding: 30px;
            font-size: 1.1rem;
        }

        /* Standings Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--bg-dark);
            color: #94a3b8;
            font-size: 0.85rem;
        }

        td {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <h1>PELOTARD</h1>
            <p>LIDOM AUTOMÁTICO</p>
        </div>
        <div class="status-badge" id="sync-status">● Auto-sincronizado (En vivo)</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('cartelera', this)">1. ⚾ Cartelera</button>
        <button class="tab-btn" onclick="switchTab('standings', this)">3. 📊 Standings</button>
    </div>

    <!-- TAB 1: CARTELERA DE JUEGOS -->
    <div id="tab-cartelera" class="tab-content active">
        <h3>Juegos de Hoy</h3>
        <div id="contenedor-cartelera" class="games-grid">
            <div class="empty-msg">Cargando cartelera de LIDOM...</div>
        </div>
    </div>

    <!-- TAB 3: POSICIONES / STANDINGS -->
    <div id="tab-standings" class="tab-content">
        <h3>Tabla de Posiciones</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>EQUIPO</th>
                        <th>JJ</th>
                        <th>G</th>
                        <th>P</th>
                        <th>PCT</th>
                        <th>DIF</th>
                        <th>RACHA</th>
                    </tr>
                </thead>
                <tbody id="contenedor-standings">
                    <tr><td colspan="7" class="empty-msg">Cargando posiciones...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Inicializar conexión con el servidor
        const socket = io();

        // Cambiar entre pestañas
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btn.classList.add('active');
        }

        // Renderizar Cartelera
        function renderCartelera(games) {
            const container = document.getElementById('contenedor-cartelera');
            if (!games || games.length === 0) {
                container.innerHTML = '<div class="empty-msg">No hay juegos programados para hoy.</div>';
                return;
            }

            let html = '';
            games.forEach(g => {
                html += `
                    <div class="game-card">
                        <div class="game-header">
                            <span>${g.status || 'Programado'}</span>
                            <span>${g.venue || ''}</span>
                        </div>
                        <div class="game-body">
                            <div class="team">
                                <span class="team-code">${g.awayTeam}</span>
                                <span class="team-name">${g.awayName || ''}</span>
                                <span class="team-score">${g.awayScore}</span>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team">
                                <span class="team-code">${g.homeTeam}</span>
                                <span class="team-name">${g.homeName || ''}</span>
                                <span class="team-score">${g.homeScore}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Renderizar Tabla de Posiciones
        function renderStandings(teams) {
            const container = document.getElementById('contenedor-standings');
            if (!teams || teams.length === 0) {
                container.innerHTML = '<tr><td colspan="7" class="empty-msg">Sin datos de posiciones disponibles.</td></tr>';
                return;
            }

            let html = '';
            teams.forEach(t => {
                html += `
                    <tr>
                        <td><strong>${t.code}</strong> - ${t.name}</td>
                        <td>${t.jj}</td>
                        <td>${t.g}</td>
                        <td>${t.p}</td>
                        <td>${t.pct}</td>
                        <td>${t.dif}</td>
                        <td>${t.racha}</td>
                    </tr>
                `;
            });
            container.innerHTML = html;
        }

        // Escuchar Socket.io
        socket.on('update-schedule', (data) => {
            console.log("Cartelera actualizada:", data);
            renderCartelera(data);
        });

        socket.on('update-standings', (data) => {
            console.log("Standings actualizados:", data);
            renderStandings(data);
        });

        // Consultar API REST inicial por si Socket.io se conecta después
        async function fetchInicial() {
            try {
                const [resSchedule, resStandings] = await Promise.all([
                    fetch('/api/schedule'),
                    fetch('/api/standings')
                ]);

                if (resSchedule.ok) {
                    const schedule = await resSchedule.json();
                    renderCartelera(schedule);
                }
                if (resStandings.ok) {
                    const standings = await resStandings.json();
                    renderStandings(standings);
                }
            } catch (err) {
                console.error("Error cargando datos iniciales:", err);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchInicial);
    </script>
</body>
</html>
